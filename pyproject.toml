[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classmate-rag"
version = "0.1.0"
description = "Retrieval-augmented generation over course materials, running locally"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Taha Kamalisadeghian", email = "tahakamali14@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
rag = "cli.main:main"

[project.urls]
Homepage = "https://github.com/taha-kms/CLASSMATE-RAG"
Issues = "https://github.com/taha-kms/CLASSMATE-RAG/issues"

[tool.setuptools.packages.find]
include = ["cli*", "rag*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-test.txt"] }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "indexes", "models", "data"]

[tool.ruff.lint]
# Deliberately not the full default set yet. pyupgrade (UP) alone would
# rewrite 464 annotations across every file, which belongs in its own change.
select = ["E", "F", "I", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# The project .env has to be read before transformers is imported, so the
# import order in this module is load-bearing.
"cli/main.py" = ["E402"]
# Lazy re-exports are resolved through __getattr__; the TYPE_CHECKING imports
# exist for editors and type checkers, not at runtime.
"rag/*/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "cli"]

[tool.coverage.run]
# Without an explicit source, coverage measures whatever got imported, which
# includes the test files themselves. They are ~100% covered by definition,
# so the reported total came out flattering and meaningless.
source = ["rag", "cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

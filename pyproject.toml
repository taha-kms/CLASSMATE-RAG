[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classmate-rag"
version = "0.1.0"
description = "Retrieval-augmented generation over course materials, running locally"
readme = "README.md"
# CI verifies 3.12 only. 3.10 and 3.11 should work, and nothing in the
# codebase needs anything newer, but they are not exercised on every push.
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Taha Kamalisadeghian", email = "tahakamali14@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
rag = "cli.main:main"

[project.urls]
Homepage = "https://github.com/taha-kms/CLASSMATE-RAG"
Issues = "https://github.com/taha-kms/CLASSMATE-RAG/issues"

[tool.setuptools.packages.find]
include = ["cli*", "rag*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-test.txt"] }
# Hosted provider SDKs, each optional. Declared from files rather than
# inline because `dynamic` and a static [project.optional-dependencies]
# cannot coexist: setuptools refuses the build outright.
optional-dependencies.anthropic = { file = ["requirements-anthropic.txt"] }
optional-dependencies.openai = { file = ["requirements-openai.txt"] }
optional-dependencies.gemini = { file = ["requirements-gemini.txt"] }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "indexes", "models", "data"]

[tool.ruff.lint]
# BLE001, S110 and S112 catch the shape behind #41 and #100: a handler that
# turns a missing method into a plausible-looking value. Every site was read
# and narrowed individually rather than bulk-silenced, so these go on with no
# per-file ignores. The handful that stay broad are the ones whose failure
# modes are genuinely open ended -- third-party parsers on hostile input, and
# the CLI boundary that has to turn anything into an exit code. Those carry an
# inline `# noqa: BLE001` with the reason, and all of them log.
select = ["E", "F", "I", "B", "C4", "UP", "BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# The project .env has to be read before transformers is imported, so the
# import order in this module is load-bearing.
"cli/main.py" = ["E402"]
# The lazy re-export shims resolve their exports through __getattr__, so the
# TYPE_CHECKING imports exist for editors and type checkers rather than at
# runtime. Listed individually: a blanket rag/*/__init__.py also covered the
# packages whose __init__ holds real code, and hid genuinely dead imports
# there.
"rag/retrieval/__init__.py" = ["F401"]
"rag/generation/__init__.py" = ["F401"]
"rag/routing/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "cli"]

[tool.coverage.run]
# Without an explicit source, coverage measures whatever got imported, which
# includes the test files themselves. They are ~100% covered by definition,
# so the reported total came out flattering and meaningless.
# One root with omits, rather than source = ["rag", "cli"]. Two source roots
# make coverage write bare filenames, so rag/__init__.py and cli/__init__.py
# both come out as "__init__.py" and Sonar cannot tell them apart.
source = ["."]
omit = [
    "tests/*",
    "tools/*",
    ".venv/*",
    "*/__pycache__/*",
    "setup.py",
]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

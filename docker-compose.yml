services:
  chroma:
    # Must match the chromadb pin in requirements.txt. 1.x also moved the data
    # directory: the server reads /config.yaml, which sets persist_path: /data,
    # and ignores the IS_PERSISTENT / PERSIST_DIRECTORY variables 0.6 used. Set
    # those and the server quietly stores nothing where you expect it.
    image: chromadb/chroma:1.5.9
    container_name: classmate-chroma
    ports:
      # Host bind is configurable so the stack still comes up when something
      # else already holds 8000. Loopback by default: there is no auth in
      # front of Chroma and this is meant to run on one machine.
      - "${CHROMA_BIND_HOST:-127.0.0.1}:${CHROMA_HOST_PORT:-8000}:8000"
    volumes:
      # 1.x opens a directory written by 0.6 in place, so upgrading needs no
      # dump and restore. Back the directory up first anyway: the server
      # rewrites the SQLite file on first open.
      - ./indexes/chroma:/data
    # No `environment:` block on purpose. The persist path comes from
    # /config.yaml, and the server reports "No telemetry is configured" by
    # default; the Python client turns telemetry off itself in
    # rag/retrieval/vector_chroma.py.
    healthcheck:
      # The image carries no curl, wget or nc, and /bin/sh is dash, so the
      # usual one-liners all fail. bash is present and /dev/tcp is a bash
      # builtin, which is enough to speak HTTP by hand.
      #
      # Grepping for "200 OK" rather than just opening the socket is the point:
      # the port accepts connections for a moment before the routes are
      # mounted, and a bare TCP probe calls that half-started server healthy.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rag:
    build:
      context: .
      args:
        # Match the host user so bind-mounted indexes do not come back owned
        # by root. Not named UID: that is readonly in bash, so the obvious
        # `UID=$(id -u) docker compose build` fails before docker runs.
        #   CLASSMATE_UID=$(id -u) CLASSMATE_GID=$(id -g) docker compose build
        UID: "${CLASSMATE_UID:-1000}"
        GID: "${CLASSMATE_GID:-1000}"
    image: classmate-rag:local
    # Run as the host user so files written into the bind mounts are owned by
    # whoever started the container. This is a runtime override, so a machine
    # whose uid is not 1000 does not need to rebuild; the build args above
    # only set the default baked into the image.
    user: "${CLASSMATE_UID:-1000}:${CLASSMATE_GID:-1000}"
    # The CLI is one-shot, so this is not started by `docker compose up`.
    # Run it with:  docker compose run --rm rag ask "..." --course Maths
    profiles: ["cli"]
    depends_on:
      chroma:
        # Waiting for "started" is not enough: the container accepts no
        # connections for a second or two after that, and the first query
        # fails rather than the stack simply taking longer to come up.
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable as `chroma`.
      # `localhost` here would be this container, which is the mistake that
      # costs an afternoon.
      CHROMA_HTTP_URL: "http://chroma:8000"
      HF_HOME: /app/models/hf_cache
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # Everything large or generated lives on the host. The image carries
      # the application and nothing else.
      - ./models:/app/models
      - ./indexes:/app/indexes
      - ./data:/app/data

name: frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  checks:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Type checking is most of the reason for choosing TypeScript, so it
      # runs first and on its own rather than only as part of the build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Checked, never rewritten, the same way ruff format is treated on the
      # Python side.
      - name: Format
        run: npm run format:check

      # Catches anything that type checks but will not bundle.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Only worth running once the bundle type checks and builds.
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        # Only the one browser. Three would triple the run for a UI nobody
        # is shipping to Safari.
        run: npx playwright install --with-deps chromium

      # Playwright serves the production build via `vite preview`, so the
      # bundle has to exist before the tests start.
      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

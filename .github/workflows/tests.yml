name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "*" ]

# Only what the job needs: check out the code and nothing else.
permissions:
  contents: read

# A second push to the same branch cancels the first rather than running the
# suite twice and waiting for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (with reports)
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          pytest -q --cov --cov-report=term-missing \
            --junitxml=artifacts/test-results.xml \
            --cov-report=xml:artifacts/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage.xml
          fail_ci_if_error: false

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: artifacts
          if-no-files-found: ignore

# Gitleaks configuration for CLASSMATE-RAG.
title = "CLASSMATE-RAG"

[extend]
# Start from the maintained default rule set rather than hand-rolling
# patterns for every provider.
useDefault = true

[allowlist]
description = "Paths and values that look like secrets but are not"

paths = [
  # Placeholders, by design. HF_TOKEN there is empty and commented.
  '''\.env\.example$''',
  # Model weights and index data, none of it hand-written.
  '''^models/''',
  '''^indexes/''',
  '''^data/''',
  # Compiled and cached copies of files scanned in their own right.
  '''__pycache__''',
  '''^\.pytest_cache/''',
  '''^\.ruff_cache/''',
  # Deliberately fake credentials, used to prove the masking and redaction
  # work. Listed by exact file rather than allowlisting tests/ wholesale,
  # so a key pasted into any other test is still caught.
  '''^tests/test_secrets\.py$''',
]

regexes = [
  # The example file documents variable names without values.
  '''HF_TOKEN=\s*$''',
  '''<your_token>''',
]


# Two provider-specific rules, added after checking which keys the default
# set actually catches. Planting a high-entropy key of each shape and
# reading back the rule that fired:
#
#   anthropic    -> NOT DETECTED
#   huggingface  -> generic-api-key
#   gemini       -> gcp-api-key
#   openai       -> generic-api-key
#
# So Anthropic needs a rule of its own, and Hugging Face only survives on
# the entropy-based generic rule, which a shorter or less random token can
# slip past. Gemini and OpenAI are already covered and get nothing here.

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face access token"
regex = '''hf_[A-Za-z0-9]{30,}'''
keywords = ["hf_"]
